<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>tgdwyer/WebCola Basic Example</title>
<style>
body,
svg {
  position: absolute;
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

.node {
  fill: #1f77b4;
  stroke: #fff;
  stroke-width: 1.5px;
}

.link {
  stroke: #999;
  stroke-opacity: .6;
}
</style>
</head>
<body>
<svg id="mynetwork"></svg>

<script src="../lib/cola.min.js"></script>
<script>
var nodes = [
  { name: 'Node 1' },
  { name: 'Node 2' },
  { name: 'Node 3' },
  { name: 'Node 4' },
  { name: 'Node 5' }
];
// source and target are indices of the nodes
var links = [
  { source: 0, target: 1 },
  { source: 0, target: 2 },
  { source: 1, target: 3 },
  { source: 1, target: 4 }
];

// WebCola computes positions only, drawing is up to you. Here we use plain SVG:
var svg = document.getElementById('mynetwork');
var lines = links.map(function () {
  return append(svg, 'line', { 'class': 'link' });
});
var circles = nodes.map(function (node) {
  var circle = append(svg, 'circle', { 'class': 'node', r: 5 });
  append(circle, 'title', {}).textContent = node.name;
  return circle;
});

var layout = new cola.Layout()
  .size([document.body.clientWidth, document.body.clientHeight])
  .nodes(nodes)
  .links(links)
  .linkDistance(60)
  .on('tick', draw)
  // the last argument asks the layout not to run to the end right away...
  .start(0, 0, 0, 0, false);

// ...so that we can show every step of it
requestAnimationFrame(function step() {
  if (!layout.tick()) requestAnimationFrame(step);
});

function draw() {
  // by now the layout has replaced indices in links with the nodes
  links.forEach(function (link, i) {
    setAttributes(lines[i], { x1: link.source.x, y1: link.source.y, x2: link.target.x, y2: link.target.y });
  });
  nodes.forEach(function (node, i) {
    setAttributes(circles[i], { cx: node.x, cy: node.y });
  });
}

function append(parent, tagName, attributes) {
  var element = document.createElementNS('http://www.w3.org/2000/svg', tagName);
  setAttributes(element, attributes);
  return parent.appendChild(element);
}

function setAttributes(element, attributes) {
  Object.keys(attributes).forEach(function (name) {
    element.setAttribute(name, attributes[name]);
  });
}
</script>
</body>
</html>
