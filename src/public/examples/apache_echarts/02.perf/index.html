<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>apache/echarts Performance Test</title>
  <style type="text/css">
    html,
    body,
    #graph {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
<div id="graph"></div>

<script src='../lib/echarts.min.js'></script>
<script src='../../../performance/runSuite.js'></script>
<script>
  runSuite(function (ngraph) {
    // copy ngraph to the format of the graph series
    var nodes = [];
    var links = [];
    ngraph.forEachNode(function (node) {
      nodes.push({ id: String(node.id) });
    });
    ngraph.forEachLink(function (link) {
      links.push({ source: String(link.fromId), target: String(link.toId) });
    });

    var chart = echarts.init(document.getElementById('graph'));
    chart.setOption({
      // do not wait for an entrance animation, show the layout as it runs
      animation: false,
      series: [{
        type: 'graph',
        layout: 'force',
        roam: true,
        symbolSize: 5,
        data: nodes,
        links: links
      }]
    });
  });
</script>
</body>
</html>
