<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>microsoft/msagljs Basic Example</title>
  <style type="text/css">
    html,
    body,
    #graph {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    #graph {
      position: relative;
    }

    #graph svg {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
<div id="graph"></div>

<!-- The layout engine, and the renderer that draws its results as SVG -->
<script src="../lib/msagl-core.min.js"></script>
<script src="../lib/msagl-renderer-svg.min.js"></script>
<script>
var graph = new msagl.Graph();

var nodes = ['Node 1', 'Node 2', 'Node 3', 'Node 4', 'Node 5'].map(function (id) {
  var node = new msagl.Node(id);
  graph.addNode(node);
  return node;
});

// an edge adds itself to the nodes that it connects
new msagl.Edge(nodes[0], nodes[1]);
new msagl.Edge(nodes[0], nodes[2]);
new msagl.Edge(nodes[1], nodes[3]);
new msagl.Edge(nodes[1], nodes[4]);

var renderer = new msagl.RendererSvg(document.getElementById('graph'));
// the layout is computed when the renderer gets the graph
renderer.setGraph(graph);
</script>
</body>
</html>
