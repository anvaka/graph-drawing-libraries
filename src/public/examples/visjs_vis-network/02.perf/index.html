<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>visjs/vis-network Performance Test</title>
  <style type="text/css">
    body,
    #mynetwork {
      position: absolute;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
<div id="mynetwork"></div>

<script src='../lib/vis-network.min.js'></script>
<script src='../../../performance/runSuite.js'></script>
<script>
  runSuite(function (ngraph) {
    var nodes = [];
    var edges = [];

    // copy ngraph to vis-network format
    ngraph.forEachNode(function (node) {
      nodes.push({ id: node.id });
    });

    ngraph.forEachLink(function (link) {
      edges.push({ from: link.fromId, to: link.toId });
    });

    // create a network
    var container = document.getElementById('mynetwork');
    var data = {
      nodes: new vis.DataSet(nodes),
      edges: new vis.DataSet(edges)
    };
    var options = {
      physics: {
        // immediately start rendering the graph
        stabilization: false,

        // tuned physics for this specific data set (stabilizes faster)
        barnesHut: {
          gravitationalConstant: -4800,
          springConstant: 0.5,
          springLength: 50
        }
      },

      // turn smooth curves off, faster
      edges: {
        smooth: false
      },

      // specify a shape for all nodes
      nodes: {
        shape: 'dot' // 'square', 'dot', 'triangle', 'triangleDown', 'star', etc...
      }
    };
    var network = new vis.Network(container, data, options);
  });
</script>
</body>
</html>
