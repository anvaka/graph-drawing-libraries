<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>dagrejs/dagre Basic Example</title>
<style>
body,
svg {
  position: absolute;
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

.node rect {
  stroke: #333;
  stroke-width: 1.5px;
  fill: #fff;
}

.edge {
  stroke: #333;
  stroke-width: 1.5px;
  fill: none;
}

text {
  font: 14px sans-serif;
  text-anchor: middle;
  dominant-baseline: central;
}
</style>
</head>
<body>
<svg id="mynetwork">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
</svg>

<script src="../lib/dagre.min.js"></script>
<script>
// Create a new directed graph
var g = new dagre.graphlib.Graph()
  .setGraph({})
  .setDefaultEdgeLabel(function() { return {}; });

// Add nodes to the graph. The first argument is the node id. The second is
// metadata about the node. Dagre needs to know dimensions of each node.
g.setNode(1, { label: "Node 1", width: 80, height: 40 });
g.setNode(2, { label: "Node 2", width: 80, height: 40 });
g.setNode(3, { label: "Node 3", width: 80, height: 40 });
g.setNode(4, { label: "Node 4", width: 80, height: 40 });
g.setNode(5, { label: "Node 5", width: 80, height: 40 });

// Add edges to the graph. Labels take space too, so they have dimensions.
g.setEdge(1, 2, { label: "Label 1->2", width: 80, height: 20 });
g.setEdge(1, 3, { label: "Label 1->3", width: 80, height: 20 });
g.setEdge(2, 4, { label: "Label 2->4", width: 80, height: 20 });
g.setEdge(2, 5, { label: "Label 2->5", width: 80, height: 20 });

// Compute the layout
dagre.layout(g);

// Dagre computes positions only, drawing is up to you. Here we use plain SVG:
var svg = document.getElementById('mynetwork');
// scale the picture to fit the screen
svg.setAttribute('viewBox', [-20, -20, g.graph().width + 40, g.graph().height + 40].join(' '));

g.edges().forEach(function (e) {
  var edge = g.edge(e);
  var points = edge.points.map(function (p) { return p.x + ',' + p.y; });
  append(svg, 'path', { 'class': 'edge', d: 'M' + points.join('L'), 'marker-end': 'url(#arrow)' });
  if (edge.label) {
    append(svg, 'text', { x: edge.x, y: edge.y }).textContent = edge.label;
  }
});

g.nodes().forEach(function (id) {
  var node = g.node(id);
  var group = append(svg, 'g', {
    'class': 'node',
    // dagre gives coordinates of the node center
    transform: 'translate(' + (node.x - node.width / 2) + ',' + (node.y - node.height / 2) + ')'
  });
  append(group, 'rect', { width: node.width, height: node.height });
  append(group, 'text', { x: node.width / 2, y: node.height / 2 }).textContent = node.label;
});

function append(parent, tagName, attributes) {
  var element = document.createElementNS('http://www.w3.org/2000/svg', tagName);
  Object.keys(attributes).forEach(function (name) {
    element.setAttribute(name, attributes[name]);
  });
  return parent.appendChild(element);
}
</script>
</body>
</html>
