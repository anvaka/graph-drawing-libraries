<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>strathausen/dracula Performance Test</title>
</head>
<body>
<div id="mynetwork"></div>

<script src='../lib/raphael.min.js'></script>
<script src='../lib/dracula.min.js'></script>
<script src='../../../performance/runSuite.js'></script>
<script>
runSuite(function (ngraph) {
  // make a new graph
  var g = new Dracula.Graph();
  ngraph.forEachLink(function (link) {
    g.addEdge(link.fromId.toString(), link.toId.toString());
  })

  var layouter = new Dracula.Layout.Spring(g);

  var renderer = new Dracula.Renderer.Raphael('#mynetwork', g, 640, 480);
  renderer.draw();
})
</script>
</body>
</html>
