<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>microsoft/msagljs Performance Test</title>
  <style type="text/css">
    html,
    body,
    #graph {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    #graph {
      position: relative;
    }
  </style>
</head>
<body>
<div id="graph"></div>

<!-- The layout engine, the reader of graphs in JSON, and the renderer for
     larger graphs: it draws with WebGL -->
<script src="../lib/msagl-core.min.js"></script>
<script src="../lib/msagl-parser.min.js"></script>
<script src="../lib/msagl-renderer-webgl.min.js"></script>
<script src='../../../performance/runSuite.js'></script>
<script>
  runSuite(function (ngraph) {
    var nodes = [];
    var edges = [];

    ngraph.forEachNode(function (node) {
      nodes.push({ id: String(node.id) });
    });
    ngraph.forEachLink(function (link) {
      edges.push({ source: String(link.fromId), target: String(link.toId) });
    });

    // The parser also tells the renderer how to draw the nodes
    var graph = msagl.parseJSON({ nodes: nodes, edges: edges });

    var renderer = new msagl.Renderer(document.getElementById('graph'));
    // The layout is computed when the renderer gets the graph. A large graph
    // is shown like a map: the most important nodes and edges first, the
    // rest appears as you zoom in.
    renderer.setGraph(graph);
  });
</script>
</body>
</html>
