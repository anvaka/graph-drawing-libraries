<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>anvaka/VivaGraphJS Basic Example</title>
  <style type="text/css">
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

<script src='../lib/vivagraph.min.js'></script>
<script>
  // create a network
  var graph = Viva.createGraph();

  graph.addLink(1, 2);
  graph.addLink(1, 3);
  graph.addLink(2, 4);
  graph.addLink(2, 5);

  // one call runs the layout and draws the graph in the window
  Viva.render(graph);
</script>
</body>
</html>
