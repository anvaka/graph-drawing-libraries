<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>mbostock/d3 Graph Drawing Performance Test</title>

<style>

.node {
  stroke: #fff;
  stroke-width: 1.5px;
}

.link {
  stroke: #999;
  stroke-opacity: .6;
}
body,
svg {
  position: absolute;
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>
<div id="mynetwork"></div>

<script src='../lib/d3.v7.min.js'></script>
<script src='../../../performance/runSuite.js'></script>
<script>
runSuite(function (ngraph) {
  var nodes = [], links = [];

  ngraph.forEachNode(function (node) {
    nodes.push({ id: node.id });
  });
  ngraph.forEachLink(function (link) {
    links.push({ source: link.fromId, target: link.toId});
  });
  var G = { nodes: nodes, links: links };
  var width = document.body.clientWidth,
    height = document.body.clientHeight;

  var svg = d3.select("#mynetwork").append("svg")
    .attr("width", width)
    .attr("height", height);

  var simulation = d3.forceSimulation(G.nodes)
    .force("charge", d3.forceManyBody().strength(-120))
    .force("link", d3.forceLink(G.links).id(function(d) { return d.id; }).distance(30))
    .force("x", d3.forceX(width / 2))
    .force("y", d3.forceY(height / 2))
    .on("tick", ticked);

  var link = svg.selectAll(".link")
    .data(G.links)
    .enter().append("line")
    .attr("class", "link");

  var node = svg.selectAll(".node")
    .data(G.nodes)
    .enter().append("circle")
    .attr("class", "node")
    .attr("r", 5)
    .call(drag(simulation));

  function ticked() {
    link
      .attr("x1", function(d) { return d.source.x; })
      .attr("y1", function(d) { return d.source.y; })
      .attr("x2", function(d) { return d.target.x; })
      .attr("y2", function(d) { return d.target.y; });

    node
      .attr("cx", function(d) { return d.x; })
      .attr("cy", function(d) { return d.y; });
  }

  function drag(simulation) {
    return d3.drag()
      .on("start", function(event, d) {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x;
        d.fy = d.y;
      })
      .on("drag", function(event, d) {
        d.fx = event.x;
        d.fy = event.y;
      })
      .on("end", function(event, d) {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null;
        d.fy = null;
      });
  }
});
</script>
</body>
</html>
