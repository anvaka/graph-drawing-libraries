<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>vasturiano/force-graph Performance Test</title>
  <style type="text/css">
    html,
    body,
    #graph {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
<div id="graph"></div>

<script src='../lib/force-graph.min.js'></script>
<script src='../../../performance/runSuite.js'></script>
<script>
  runSuite(function (ngraph) {
    // copy ngraph to the format of force-graph
    var nodes = [];
    var links = [];
    ngraph.forEachNode(function (node) {
      nodes.push({ id: node.id });
    });
    ngraph.forEachLink(function (link) {
      links.push({ source: link.fromId, target: link.toId });
    });

    new ForceGraph(document.getElementById('graph'))
      .graphData({ nodes: nodes, links: links });
  });
</script>
</body>
</html>
