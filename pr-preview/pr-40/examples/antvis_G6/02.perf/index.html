<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>antvis/G6 Performance Test</title>
  <style type="text/css">
    html,
    body,
    #graph {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
<div id="graph"></div>

<script src='../lib/g6.min.js'></script>
<script src='../../../performance/runSuite.js'></script>
<script>
  runSuite(function (ngraph) {
    // copy ngraph to the format of G6; ids are strings there
    var nodes = [];
    var edges = [];
    ngraph.forEachNode(function (node) {
      nodes.push({ id: String(node.id) });
    });
    ngraph.forEachLink(function (link) {
      edges.push({ source: String(link.fromId), target: String(link.toId) });
    });

    var graph = new G6.Graph({
      container: 'graph',
      data: { nodes: nodes, edges: edges },
      // smaller nodes than the default, so that large graphs are readable
      node: { style: { size: 8 } },
      // draw without an entrance animation, and keep the whole graph in the view
      animation: false,
      autoFit: 'view',
      layout: { type: 'd3-force' },
      behaviors: ['drag-canvas', 'zoom-canvas', 'drag-element']
    });
    graph.render();
  });
</script>
</body>
</html>
