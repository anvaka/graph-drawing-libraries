<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>memgraph/orb Performance Test</title>
  <style type="text/css">
    html,
    body,
    #graph {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
<div id="graph"></div>

<script src='../lib/orb.min.js'></script>
<script src='../../../performance/runSuite.js'></script>
<script>
  runSuite(function (ngraph) {
    // copy ngraph to the format of Orb; every edge has its own id
    var nodes = [];
    var edges = [];
    ngraph.forEachNode(function (node) {
      nodes.push({ id: node.id });
    });
    ngraph.forEachLink(function (link) {
      edges.push({ id: edges.length, start: link.fromId, end: link.toId });
    });

    var orb = new Orb.OrbView(document.getElementById('graph'));
    orb.data.setup({ nodes: nodes, edges: edges });
    orb.render(function () {
      orb.recenter();
    });
  });
</script>
</body>
</html>
