<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>jacomyal/sigma.js Performance test</title>
  <style type="text/css">
    body,
    #mynetwork {
      position: absolute;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
<div id="mynetwork"></div>

<script src='../lib/graphology.umd.min.js'></script>
<script src='../lib/graphology-library.min.js'></script>
<script src='../lib/sigma.min.js'></script>
<script src='../../../performance/runSuite.js'></script>
<script>
runSuite(function (ngraph) {
  // copy ngraph to graphology
  var graph = new graphology.Graph();
  ngraph.forEachNode(function (node) {
    graph.addNode(node.id, { x: Math.random(), y: Math.random(), size: 3, color: '#666' });
  });
  ngraph.forEachLink(function (link) {
    graph.mergeEdge(link.fromId, link.toId);
  });

  var renderer = new Sigma(graph, document.getElementById('mynetwork'), {
    settings: {
      // node sizes are in pixels, not in the units of the graph coordinates
      itemSizesReference: 'screen'
    }
  });

  var forceAtlas2 = graphologyLibrary.layoutForceAtlas2;
  var layout = new graphologyLibrary.FA2Layout(graph, {
    settings: forceAtlas2.inferSettings(graph)
  });
  layout.start();
});
</script>
</body>
</html>
