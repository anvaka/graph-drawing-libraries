<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>mdaines/viz-js Performance Test</title>
<style>
html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

/* Graphviz gives the picture a size in points, let it fill the page instead */
svg {
  display: block;
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>
<script src="../lib/viz-global.js"></script>
<script src='../../../performance/runSuite.js'></script>
<script>
runSuite(function (ngraph) {
  var nodes = [];
  var edges = [];

  ngraph.forEachNode(function (node) {
    nodes.push({ name: String(node.id) });
  });
  ngraph.forEachLink(function (link) {
    edges.push({ tail: String(link.fromId), head: String(link.toId) });
  });

  Viz.instance().then(function (viz) {
    // Without options Graphviz uses its "dot" engine, which draws hierarchies.
    // Other engines are chosen with { engine: 'neato' }, see viz.engines
    var svg = viz.renderSVGElement({ nodes: nodes, edges: edges });
    document.body.appendChild(svg);
  });
});
</script>
</body>
</html>
