<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>memgraph/orb Basic Example</title>
  <style type="text/css">
    html,
    body,
    #graph {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
<div id="graph"></div>

<script src='../lib/orb.min.js'></script>
<script>
  // create a network; every edge has its own id
  var nodes = [{ id: 1 }, { id: 2 }, { id: 3 }, { id: 4 }, { id: 5 }];
  var edges = [
    { id: 1, start: 1, end: 2 },
    { id: 2, start: 1, end: 3 },
    { id: 3, start: 2, end: 4 },
    { id: 4, start: 2, end: 5 }
  ];

  var orb = new Orb.OrbView(document.getElementById('graph'));
  orb.data.setup({ nodes: nodes, edges: edges });
  orb.render(function () {
    orb.recenter();
  });
</script>
</body>
</html>
