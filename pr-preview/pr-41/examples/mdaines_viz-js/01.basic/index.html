<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>mdaines/viz-js Basic Example</title>
<style>
html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

/* Graphviz gives the picture a size in points, let it fill the page instead */
svg {
  display: block;
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>
<script src="../lib/viz-global.js"></script>
<script>
// Viz.js is Graphviz compiled to WebAssembly, the instance is ready when it is loaded
Viz.instance().then(function (viz) {
  // The graph can be a string in the DOT language as well:
  // 'digraph { "Node 1" -> "Node 2" }'
  var svg = viz.renderSVGElement({
    edges: [
      { tail: 'Node 1', head: 'Node 2' },
      { tail: 'Node 1', head: 'Node 3' },
      { tail: 'Node 2', head: 'Node 4' },
      { tail: 'Node 2', head: 'Node 5' }
    ]
  });

  document.body.appendChild(svg);
});
</script>
</body>
</html>
