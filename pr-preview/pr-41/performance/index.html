<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ctext y=%2714%27 font-size=%2716%27 fill=%27%23d1242f%27%3E♥%3C/text%3E%3C/svg%3E">
    <title>Graph drawing libraries performance comparison</title>
    <script type="module" crossorigin src="../assets/index-BTsxBcVB.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/libraries-BEzh4dam.js">
    <link rel="stylesheet" crossorigin href="../assets/libraries-CJAGANf3.css">
  </head>
  <body class="performance">
    <header class="site-header">
      <a class="brand" href="../#/all">We <span class="heart">♥</span> Graphs</a>
      <!-- Narrow screens have no room for the list of libraries -->
      <div class="switcher">
        <a id="previous" class="step">‹</a>
        <select id="library" aria-label="Rendered with"></select>
        <a id="next" class="step">›</a>
      </div>
      <label>
        Graph
        <select id="graph"></select>
      </label>
      <form id="size" class="size-form" hidden></form>
      <a href="https://github.com/anvaka/graph-drawing-libraries">GitHub</a>
    </header>
    <div class="workbench">
      <nav class="library-list" aria-label="Libraries">
        <a class="back" href="../#/all">← All libraries</a>
        <h2>Rendered with</h2>
        <ul id="libraries"></ul>
      </nav>
      <main class="stage">
        <p id="library-info" class="library-info"></p>
        <p id="graph-info" class="graph-info" aria-live="polite"></p>
        <p id="notice" class="notice" role="status" hidden></p>
        <div id="guard" class="guard" hidden>
          <p id="guard-text"></p>
          <button id="guard-go">Render anyway</button>
        </div>
        <iframe id="runner" title="Graph rendered by the selected library"></iframe>
      </main>
    </div>
  </body>
</html>
