<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ecomfe/echarts-gl Basic Example</title>
  <style type="text/css">
    html,
    body,
    #graph {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
<div id="graph"></div>

<!-- ECharts GL is an extension of ECharts, it needs ECharts to be loaded first -->
<script src='../../apache_echarts/lib/echarts.min.js'></script>
<script src='../lib/echarts-gl.min.js'></script>
<script>
  var chart = echarts.init(document.getElementById('graph'));

  chart.setOption({
    series: [{
      // graphGL draws with WebGL and computes the ForceAtlas2 layout on the GPU
      type: 'graphGL',
      roam: true,
      symbolSize: 10,
      // without a color and an opacity of its own graphGL 2.1 draws the first node only
      itemStyle: { color: '#5470c6', opacity: 1 },
      // the layout keeps a graph this small very tight, push the nodes apart
      forceAtlas2: { scaling: 200 },
      nodes: [
        { name: 'Node 1' },
        { name: 'Node 2' },
        { name: 'Node 3' },
        { name: 'Node 4' },
        { name: 'Node 5' }
      ],
      // source and target are names of the nodes
      links: [
        { source: 'Node 1', target: 'Node 2' },
        { source: 'Node 1', target: 'Node 3' },
        { source: 'Node 2', target: 'Node 4' },
        { source: 'Node 2', target: 'Node 5' }
      ]
    }]
  });
</script>
</body>
</html>
