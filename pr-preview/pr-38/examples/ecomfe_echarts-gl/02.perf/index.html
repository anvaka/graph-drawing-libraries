<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ecomfe/echarts-gl Performance Test</title>
  <style type="text/css">
    html,
    body,
    #graph {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
<div id="graph"></div>

<!-- ECharts GL is an extension of ECharts, it needs ECharts to be loaded first -->
<script src='../../apache_echarts/lib/echarts.min.js'></script>
<script src='../lib/echarts-gl.min.js'></script>
<script src='../../../performance/runSuite.js'></script>
<script>
  runSuite(function (ngraph) {
    // copy ngraph to the format of the graphGL series
    var nodes = [];
    var links = [];
    ngraph.forEachNode(function (node) {
      nodes.push({ name: String(node.id) });
    });
    ngraph.forEachLink(function (link) {
      links.push({ source: String(link.fromId), target: String(link.toId) });
    });

    var chart = echarts.init(document.getElementById('graph'));
    chart.setOption({
      series: [{
        // graphGL draws with WebGL and computes the ForceAtlas2 layout on the GPU
        type: 'graphGL',
        roam: true,
        // without a color and an opacity of its own graphGL 2.1 draws the first node only
        itemStyle: { color: '#5470c6', opacity: 1 },
        nodes: nodes,
        links: links
      }]
    });
  });
</script>
</body>
</html>
