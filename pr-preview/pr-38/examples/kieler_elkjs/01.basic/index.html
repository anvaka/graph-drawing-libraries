<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>kieler/elkjs Basic Example</title>
<style>
body,
svg {
  position: absolute;
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}

.node rect {
  stroke: #333;
  stroke-width: 1.5px;
  fill: #fff;
}

.edge {
  stroke: #333;
  stroke-width: 1.5px;
  fill: none;
}

text {
  font: 14px sans-serif;
  text-anchor: middle;
  dominant-baseline: central;
}
</style>
</head>
<body>
<svg id="mynetwork">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
</svg>

<script src="../lib/elk.bundled.js"></script>
<script>
var elk = new ELK();

// ELK needs to know dimensions of each node. Edges may connect several
// sources with several targets, that is why they are arrays.
elk.layout({
  id: 'root',
  children: [
    { id: 'Node 1', width: 80, height: 40 },
    { id: 'Node 2', width: 80, height: 40 },
    { id: 'Node 3', width: 80, height: 40 },
    { id: 'Node 4', width: 80, height: 40 },
    { id: 'Node 5', width: 80, height: 40 }
  ],
  edges: [
    { id: 'e1', sources: ['Node 1'], targets: ['Node 2'] },
    { id: 'e2', sources: ['Node 1'], targets: ['Node 3'] },
    { id: 'e3', sources: ['Node 2'], targets: ['Node 4'] },
    { id: 'e4', sources: ['Node 2'], targets: ['Node 5'] }
  ]
}).then(draw);

// ELK computes positions only, drawing is up to you. Here we use plain SVG:
function draw(graph) {
  var svg = document.getElementById('mynetwork');
  // scale the picture to fit the screen
  svg.setAttribute('viewBox', [-20, -20, graph.width + 40, graph.height + 40].join(' '));

  graph.edges.forEach(function (edge) {
    edge.sections.forEach(function (section) {
      var points = [section.startPoint].concat(section.bendPoints || [], [section.endPoint]);
      var path = points.map(function (p) { return p.x + ',' + p.y; });
      append(svg, 'path', { 'class': 'edge', d: 'M' + path.join('L'), 'marker-end': 'url(#arrow)' });
    });
  });

  graph.children.forEach(function (node) {
    // ELK gives coordinates of the top left corner
    var group = append(svg, 'g', { 'class': 'node', transform: 'translate(' + node.x + ',' + node.y + ')' });
    append(group, 'rect', { width: node.width, height: node.height });
    append(group, 'text', { x: node.width / 2, y: node.height / 2 }).textContent = node.id;
  });
}

function append(parent, tagName, attributes) {
  var element = document.createElementNS('http://www.w3.org/2000/svg', tagName);
  Object.keys(attributes).forEach(function (name) {
    element.setAttribute(name, attributes[name]);
  });
  return parent.appendChild(element);
}
</script>
</body>
</html>
