<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>anvaka/VivaGraphJS Performance Test</title>
  <style type="text/css">
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

<script src='../lib/vivagraph.min.js'></script>
<script src='../../../performance/runSuite.js'></script>
<script>
  runSuite(function (graph) {
    // The performance suite makes an ngraph.graph, which is what VivaGraph
    // draws: no need to convert it. Everything else is left at its default,
    // so from 2,000 nodes up the layout runs on WebGPU where there is one.
    Viva.render(graph);
  });
</script>
</body>
</html>
