name: Deploy website

on:
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/deploy.yml']
  schedule:
    # Refresh GitHub statistics every Monday
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - name: Refresh GitHub statistics
        # The committed data/stats.json is used when GitHub API is not available
        continue-on-error: true
        run: npm run stats
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: src/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
