name: Deploy website

on:
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/deploy.yml']
  schedule:
    # Refresh GitHub statistics every Monday
    - cron: '0 6 * * 1'
  workflow_dispatch:

# The website is served from the gh-pages branch: previews of pull requests
# live there too, in pr-preview/, see preview.yml
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - name: Refresh GitHub statistics
        # The committed data/stats.json is used when GitHub API is not available
        continue-on-error: true
        run: npm run stats
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm test
      - run: npm run build
      # Without it GitHub Pages runs the files through Jekyll
      - run: touch dist/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: src/dist
          branch: gh-pages
          # Previews of open pull requests stay where they are
          clean-exclude: pr-preview/
          force: false
